apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// GitHub Actions がビルド時だけ Secrets から復元する固定の署名鍵(リポジトリには入れない)
def stableKeystore = file("typingpet.jks")

// バージョンは version.properties を唯一の情報源にする
def versionProps = new Properties()
def versionFile = rootProject.file("version.properties")
if (versionFile.exists()) {
    versionFile.withInputStream { versionProps.load(it) }
}

android {
    namespace 'com.maoyou.typingpet'
    compileSdk 34

    defaultConfig {
        applicationId "com.maoyou.typingpet"
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(versionProps.getProperty("versionCode", "3"))
        versionName versionProps.getProperty("versionName", "1.2.0")
    }

    signingConfigs {
        stable {
            if (stableKeystore.exists()) {
                storeFile stableKeystore
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            if (stableKeystore.exists()) signingConfig signingConfigs.stable
        }
        release {
            minifyEnabled false
            if (stableKeystore.exists()) signingConfig signingConfigs.stable
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions { jvmTarget = '1.8' }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
    implementation "androidx.core:core:1.13.1"
    testImplementation "junit:junit:4.13.2"
}
