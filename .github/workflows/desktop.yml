name: Desktop build

on:
  push:
    paths:
      - "desktop/**"
      - "app/src/main/res/raw/**"
      - "scripts/package_desktop_dist.sh"
      - "version.properties"
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^versionName=' version.properties | cut -d= -f2 | tr -d ' \r')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test and build fat jar
        shell: bash
        working-directory: desktop
        run: gradle --no-daemon test fatJar

      - name: Package distribution zip
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then PLATFORM=windows; else PLATFORM=linux; fi
          VERSION="${{ steps.version.outputs.version }}"
          bash scripts/package_desktop_dist.sh "$PLATFORM" "desktop/build/libs/catsquid-desktop-${VERSION}.jar"

      - name: Upload distribution zip
        uses: actions/upload-artifact@v4
        with:
          name: catsquid-desktop-${{ matrix.os }}
          path: dist/desktop/*.zip
          if-no-files-found: error

      - name: Build app image with jpackage (optional)
        shell: bash
        continue-on-error: true
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then PLATFORM=windows; else PLATFORM=linux; fi
          VERSION="${{ steps.version.outputs.version }}"
          JAR_NAME="catsquid-desktop-${VERSION}.jar"
          OUT="dist/desktop/catsquid-desktop-${VERSION}-${PLATFORM}-app-image.zip"
          mkdir -p desktop/build/jpackage/input dist/desktop
          rm -rf desktop/build/jpackage/CatSquid
          cp "desktop/build/libs/${JAR_NAME}" desktop/build/jpackage/input/
          jpackage --type app-image --name CatSquid --app-version "$VERSION" \
            --input desktop/build/jpackage/input --main-jar "$JAR_NAME" \
            --main-class com.maoyou.typingpet.desktop.MainKt \
            --add-modules java.desktop,java.logging \
            --java-options "-Dfile.encoding=UTF-8" \
            --dest desktop/build/jpackage
          if [ "$PLATFORM" = "linux" ]; then
            (cd desktop/build/jpackage && zip -q -r -y "$GITHUB_WORKSPACE/$OUT" CatSquid)
          else
            powershell.exe -NoProfile -Command "Compress-Archive -Path 'desktop/build/jpackage/CatSquid' -DestinationPath '${OUT}' -Force"
          fi

      - name: Upload app image zip
        uses: actions/upload-artifact@v4
        with:
          name: catsquid-desktop-${{ matrix.os }}-app-image
          path: dist/desktop/*-app-image.zip
          if-no-files-found: ignore
